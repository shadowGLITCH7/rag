[project]
name = "yrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shadowGLITCH7", email = "glitchshadow39@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
yrag = "yrag:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
